// The admin service (PLAN section 8.7).
syntax = "proto3";

package giles.admin.v1;

import "giles/channel/v1/channel.proto";
import "giles/plugin/v1/plugin.proto";
import "giles/types/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Served by the core on run/admin.sock. The giles CLI and the web admin pages are its clients.
// Every call carries the token from run/admin.token as "authorization: Bearer TOKEN" metadata.
//
// The user and pairing RPCs of PLAN section 8.7 are multi-user features and are added here,
// additively, when those are built.
service AdminService {
  // The daemon's state: version, last config error, and every plugin with its sandbox and channel
  // status.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Every configured plugin instance.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  // Restarts a plugin instance now, clearing its restart backoff. NOT_FOUND if there is no such
  // plugin instance.
  rpc RestartPlugin(RestartPluginRequest) returns (RestartPluginResponse);
  // Sessions, newest activity first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Ends a session, like /new: later messages in its conversation start a fresh one.
  rpc ResetSession(ResetSessionRequest) returns (ResetSessionResponse);
  // A one-time web login URL for a user (PLAN section 3.4).
  rpc CreateLoginLink(CreateLoginLinkRequest) returns (CreateLoginLinkResponse);
  // Token usage summed per agent, provider instance, and model (PLAN section 11.7).
  rpc UsageReport(UsageReportRequest) returns (UsageReportResponse);
  // Writes a consistent snapshot of the data root to a directory (PLAN section 11.4).
  rpc Backup(BackupRequest) returns (BackupResponse);
  // Every toolset: the ones stored in the database and the ones in giles.toml, by name.
  rpc ListToolsets(ListToolsetsRequest) returns (ListToolsetsResponse);
  // One toolset, with its spec as TOML. NOT_FOUND if there is no such toolset.
  rpc GetToolset(GetToolsetRequest) returns (GetToolsetResponse);
  // Creates a stored toolset, a remote MCP server, or replaces the spec of the one with that name,
  // with no Giles restart. Status codes: INVALID_ARGUMENT (the message starts with the key of the
  // spec at fault, such as url for a stdio server), ALREADY_EXISTS (another call created the name
  // first), NOT_FOUND (expected_updated_at is set and there is no such toolset),
  // FAILED_PRECONDITION (the toolset changed since expected_updated_at, or it is configured in
  // giles.toml), and UNAVAILABLE (no toolset management).
  rpc SetToolset(SetToolsetRequest) returns (SetToolsetResponse);
  // Removes a stored toolset. NOT_FOUND if there is none; FAILED_PRECONDITION if it is configured
  // in giles.toml.
  rpc RemoveToolset(RemoveToolsetRequest) returns (RemoveToolsetResponse);
}

message StatusRequest {}

message StatusResponse {
  // The core's version.
  string version = 1;
  // When the core started.
  google.protobuf.Timestamp started_at = 2;
  // The last configuration error, if any. v1 reads the configuration only at startup, where an
  // error stops the core, so this stays unset until configuration reload (PLAN D28).
  optional string config_error = 3;
  // Every configured plugin instance, as in ListPlugins.
  repeated PluginInstance plugins = 4;
  // Whether this host can sandbox plugins, from the startup check (PLAN section 12.1).
  SandboxHost sandbox_host = 5;
  // Every configured channel instance, built-in or plugin, sorted by name.
  repeated ChannelInstance channels = 6;
}

// Whether the host can sandbox plugins (PLAN section 12.1).
message SandboxHost {
  // True if sandboxed plugins can start.
  bool available = 1;
  // How the host sandboxes, e.g. "Landlock ABI 6 and seccomp filters", or why it can't.
  string description = 2;
  // Linux: the effective Landlock ABI.
  optional uint32 landlock_abi = 3;
}

// A configured channel instance.
message ChannelInstance {
  // The instance name.
  string instance = 1;
  // The component, e.g. "web" or "irc".
  string component = 2;
  // Where it runs.
  ChannelRuntime runtime = 3;
  // The last status it reported since the core started. Unset before its first.
  giles.channel.v1.ChannelStatus status = 4;
  // When the core received that status.
  google.protobuf.Timestamp status_at = 5;
}

// Where a channel runs.
enum ChannelRuntime {
  CHANNEL_RUNTIME_UNSPECIFIED = 0;
  // Compiled into the core.
  CHANNEL_RUNTIME_BUILT_IN = 1;
  // A plugin the core launches.
  CHANNEL_RUNTIME_PLUGIN = 2;
  // A plugin someone else runs, reached over the network.
  CHANNEL_RUNTIME_REMOTE = 3;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated PluginInstance plugins = 1;
}

// A configured instance that runs as a plugin: a gRPC plugin or an MCP toolset, local or remote.
// Built-in components are part of the core and aren't listed. The lifecycle fields (state through
// requested_grants, retry_at, and tool_count) come from plugin supervision and stay unset without
// it.
message PluginInstance {
  // The instance name, e.g. "libera".
  string instance = 1;
  // The kind of instance.
  InstanceKind kind = 2;
  // The component, e.g. "irc" for giles-channel-irc. Empty for an MCP toolset that runs a command
  // or a URL.
  string component = 3;
  // The executable's path once found, else the program as configured (e.g. giles-channel-irc); or
  // the URL of a remote instance.
  string location = 4;
  // Where the instance is in its lifecycle (PLAN section 7.5). UNSPECIFIED: not known.
  PluginState state = 5;
  // The version the plugin reports (Describe or the MCP server info), once known.
  optional string version = 6;
  // The process id of a running local plugin.
  optional uint32 pid = 7;
  // Restarts since the core started.
  uint32 restarts = 8;
  // The last launch, health check, or connection error.
  optional string last_error = 9;
  // When the current process started or the current connection was made. Set while RUNNING.
  google.protobuf.Timestamp started_at = 10;
  // The sandbox the plugin runs in. Unset for remote instances.
  SandboxStatus sandbox = 11;
  // The grants the plugin asked for in Describe. Advisory only.
  giles.plugin.v1.SandboxGrants requested_grants = 12;
  // The last status a channel plugin reported.
  giles.channel.v1.ChannelStatus channel_status = 13;
  // In BACKOFF: when the next launch or connection attempt starts.
  google.protobuf.Timestamp retry_at = 14;
  // The number of tools an MCP toolset currently offers to new sessions. Unset for other kinds.
  optional uint32 tool_count = 15;
}

// The kind of a configured instance.
enum InstanceKind {
  INSTANCE_KIND_UNSPECIFIED = 0;
  INSTANCE_KIND_PROVIDER = 1;
  INSTANCE_KIND_CHANNEL = 2;
  INSTANCE_KIND_TOOLSET = 3;
}

// Where a plugin instance is in its lifecycle.
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  // Launching or connecting.
  PLUGIN_STATE_STARTING = 1;
  // Up and healthy.
  PLUGIN_STATE_RUNNING = 2;
  // A toolset stopped for idleness; the next call relaunches it.
  PLUGIN_STATE_IDLE = 3;
  // Down, waiting to restart or reconnect.
  PLUGIN_STATE_BACKOFF = 4;
  // Down and not retried, e.g. after a protocol version mismatch, until the binary changes (for a
  // toolset: until it is restarted).
  PLUGIN_STATE_FAILED = 5;
  // Stopped because the core is shutting down.
  PLUGIN_STATE_STOPPED = 6;
}

// The sandbox a local plugin runs in (PLAN section 12).
message SandboxStatus {
  // False if the instance runs with unsandboxed = true.
  bool enabled = 1;
  // Linux: the effective Landlock ABI.
  optional uint32 landlock_abi = 2;
  // Guarantees the effective sandbox lacks on this host, for the operator, given the instance's
  // grants. If the host can't sandbox plugins at all, the one entry says why (the plugin can't
  // start).
  repeated string missing = 3;
}

message RestartPluginRequest {
  // The instance name.
  string instance = 1;
}

message RestartPluginResponse {}

message ListSessionsRequest {
  // Only this agent's sessions.
  optional string agent = 1;
  // Also list ended sessions.
  bool include_ended = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// A session: one conversation's history with one agent (PLAN section 6.2).
message Session {
  // The session id, for ResetSession.
  string id = 1;
  // The agent.
  string agent = 2;
  // The channel instance. Unset for sessions without a conversation, e.g. isolated job runs.
  optional string instance = 3;
  // The conversation. Unset for sessions without a conversation.
  giles.types.v1.ConversationRef conversation = 4;
  // When the session started.
  google.protobuf.Timestamp started_at = 5;
  // When the session ended. Unset while it is active.
  google.protobuf.Timestamp ended_at = 6;
  // When its last message was stored.
  google.protobuf.Timestamp last_message_at = 7;
  // The number of messages in its transcript.
  uint64 message_count = 8;
}

message ResetSessionRequest {
  // The session id, from ListSessions.
  string session_id = 1;
}

message ResetSessionResponse {}

message CreateLoginLinkRequest {
  // The user name.
  string user = 1;
}

message CreateLoginLinkResponse {
  // The one-time login URL.
  string url = 1;
  // When the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

message UsageReportRequest {
  // Only requests at or after this time. Unset: from the first request.
  google.protobuf.Timestamp since = 1;
  // Only requests before this time. Unset: up to now.
  google.protobuf.Timestamp until = 2;
}

message UsageReportResponse {
  // One row per agent, provider instance, and model that made requests in the period.
  repeated UsageRow rows = 1;
}

// Usage summed over the provider requests of one agent, provider instance, and model.
message UsageRow {
  // The agent.
  string agent = 1;
  // The provider instance.
  string provider = 2;
  // The model id.
  string model = 3;
  // The number of requests.
  uint64 requests = 4;
  // How many of them were fallbacks from another model (PLAN section 6.10).
  uint64 fallback_requests = 5;
  // The summed token counts. The prompt cache hit rate is cache_read_tokens divided by all input
  // tokens (input, cache read, and cache write).
  giles.types.v1.Usage usage = 6;
}

message BackupRequest {
  // An absolute path to an existing directory to write the backup into.
  string dir = 1;
}

message BackupResponse {
  // The absolute paths of the files written.
  repeated string paths = 1;
}

message ListToolsetsRequest {}

message ListToolsetsResponse {
  // Every toolset, ordered by name ignoring case.
  repeated Toolset toolsets = 1;
}

// An MCP toolset (PLAN section 7.10): a remote server stored in the database, or a
// [toolset.<name>] table of giles.toml.
message Toolset {
  // The name, as it was written. It is also the prefix of the toolset's tools.
  string name = 1;
  // Where the toolset is configured.
  ToolsetSource source = 2;
  // The spec as TOML text: the keys of a [toolset.<name>] table at the top level. The bearer token
  // is a reference ({ secret = "name" }), as it was written, never resolved.
  // Unset for a giles.toml toolset, and for a stored one whose spec can't be read (failure says
  // why).
  optional string spec_toml = 3;
  // When the stored toolset was last changed. Send it back as SetToolsetRequest.expected_updated_at
  // to replace the spec only if nothing changed meanwhile. Unset for a giles.toml toolset.
  google.protobuf.Timestamp updated_at = 4;
  // Why a stored toolset isn't running (it failed validation at startup, or the change that
  // should have started it failed). Never contains a secret value. Unset otherwise.
  optional string failure = 5;
}

// Where a toolset is configured.
enum ToolsetSource {
  TOOLSET_SOURCE_UNSPECIFIED = 0;
  // A remote server in the database, made in the web UI or with SetToolset. Can be changed and
  // removed.
  TOOLSET_SOURCE_STORED = 1;
  // A [toolset.<name>] table of giles.toml, which can only be changed there.
  TOOLSET_SOURCE_GILES_TOML = 2;
}

message GetToolsetRequest {
  // The toolset name, ignoring ASCII case.
  string name = 1;
}

message GetToolsetResponse {
  Toolset toolset = 1;
}

message SetToolsetRequest {
  // The toolset name. Naming a stored toolset (ignoring ASCII case) replaces its spec; any other
  // name creates a toolset.
  string name = 1;
  // The spec as TOML text, with the keys of a remote server's [toolset.<name>] table at the top
  // level: url, auth, insecure, deadline, parallel, and skills. A stdio server (command) is refused:
  // it is configured in giles.toml.
  string spec_toml = 2;
  // The updated_at of the toolset as the caller last read it. If set, the call is refused
  // (FAILED_PRECONDITION) when the toolset has changed since, and NOT_FOUND when there is no such
  // toolset. Unset: replace whatever is there, or create.
  google.protobuf.Timestamp expected_updated_at = 3;
}

message SetToolsetResponse {
  // The toolset as stored.
  Toolset toolset = 1;
}

message RemoveToolsetRequest {
  // The toolset name, ignoring ASCII case.
  string name = 1;
}

message RemoveToolsetResponse {
  // The toolset's name as it was stored, which can differ in case from the request's.
  string name = 1;
}
