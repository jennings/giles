{%- if let Some(error) = password.error %}
<p class="banner banner-error" role="alert">{{ error }}</p>
{%- endif %}
{%- if password.plain_http %}
{% include "web/plain_http_warning.html" %}
{%- endif %}
<form class="form" method="post" action="/login/password">
<input type="hidden" name="nonce" value="{{ password.nonce }}">
<div class="field">
<label for="login-username">Username</label>
<input id="login-username" name="username" value="{{ password.username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
</div>
<div class="field">
<label for="login-password">Password</label>
<input id="login-password" name="password" type="password" autocomplete="current-password" required>
</div>
<div class="form-actions">
<button type="submit" class="button-primary">Log in</button>
</div>
</form>
