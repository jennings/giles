[package]
name = "giles-core"
description = "Giles orchestration: agent loop, routing, sessions, scheduling, and plugin supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["provider-anthropic", "provider-openai"]
# The built-in Anthropic Messages API provider (`providers::anthropic`).
provider-anthropic = ["dep:base64"]
# The built-in OpenAI-compatible Chat Completions provider (`providers::openai`).
provider-openai = ["dep:base64"]

[dependencies]
askama = "0.16.1"
async-trait.workspace = true
axum = "0.8.9"
base64 = { version = "0.22.1", optional = true }
bytes.workspace = true
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
futures.workspace = true
giles-proto.workspace = true
giles-store.workspace = true
giles-types.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
reqwest.workspace = true
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-async-rw"] }
serde.workspace = true
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
serde_path_to_error = "0.1.20"
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url = "2.5.8"
webpki-root-certs = "1.0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost.workspace = true
# The MCP test server (tests/support/mcp_server.rs).
rmcp = { version = "3.7.0", default-features = false, features = ["elicitation", "server", "transport-io"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tonic.workspace = true
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

# Runs the MCP test server as its own stdio child, so it can't use libtest (which prints to stdout).
[[test]]
name = "mcp_stdio"
harness = false
