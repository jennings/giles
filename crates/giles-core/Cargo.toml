[package]
name = "giles-core"
description = "Giles orchestration: agent loop, routing, sessions, scheduling, and plugin supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["provider-anthropic"]
# The built-in Anthropic Messages API provider (`providers::anthropic`).
provider-anthropic = ["dep:reqwest", "dep:webpki-root-certs"]

[dependencies]
bytes.workspace = true
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
futures.workspace = true
giles-proto.workspace = true
giles-store.workspace = true
giles-types.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
url = "2.5.8"
webpki-root-certs = { version = "1.0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tonic.workspace = true
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
