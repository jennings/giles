[package]
name = "giles-core"
description = "Giles orchestration: agent loop, routing, sessions, scheduling, and plugin supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["channel-web", "provider-anthropic", "provider-openai"]
# The built-in web channel (`channels::web`): chat pages, live output, login, admin pages.
channel-web = ["dep:qrcode"]
# The built-in Anthropic Messages API provider (`providers::anthropic`).
provider-anthropic = []
# The built-in OpenAI-compatible Chat Completions provider (`providers::openai`).
provider-openai = []

[dependencies]
askama = "0.16.1"
async-trait.workspace = true
axum = "0.8.9"
# Media in provider requests and in MCP tool results.
base64.workspace = true
bytes.workspace = true
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
futures.workspace = true
# The proto <-> domain conversions the admin service and the `RemoteChannel` adapter share with
# plugins, the web channel's renderer, and (`tls`) the TLS client settings for remote plugins.
giles-plugin-sdk = { workspace = true, default-features = false, features = ["tls"] }
giles-proto.workspace = true
giles-store.workspace = true
giles-types.workspace = true
# Per-launch plugin tokens, trace ids, and the web channel's ids and login tokens.
getrandom = "0.4.3"
# The one-shot connector to a plugin's end of the socket pair (`plugin_host`).
hyper-util.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
# `google.protobuf.Timestamp` in the admin service.
prost-types.workspace = true
# QR codes of channels that need linking, on the web admin pages (rendered to SVG by hand, so no
# image features).
qrcode = { version = "0.14.1", default-features = false, optional = true }
reqwest.workspace = true
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
serde_path_to_error = "0.1.20"
sha2.workspace = true
# The tar half of a backup (`backup`); no extended attributes.
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
toml.workspace = true
# Edits `giles.toml` and `agent.toml` for `giles instance rename`, keeping comments and formatting.
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
tonic.workspace = true
tonic-health.workspace = true
tower.workspace = true
tracing.workspace = true
url = "2.5.8"
webpki-root-certs = "1.0.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc.workspace = true
seccompiler = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
prost.workspace = true
# The MCP test server (tests/support/mcp_server.rs).
rmcp = { version = "3.7.0", default-features = false, features = ["elicitation", "server", "transport-io", "transport-streamable-http-server"] }
# Fault injection into the database in the sessions tests.
rusqlite.workspace = true
socket2 = "0.6.5"
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tonic-prost = "0.14.6"
tracing-subscriber = { workspace = true, features = ["fmt"] }

# Runs the MCP test server as its own stdio child, so it can't use libtest (which prints to stdout).
[[test]]
name = "mcp_stdio"
harness = false

# Runs the MCP test server through the sandbox trampoline, both being the test binary itself.
[[test]]
name = "toolsets"
harness = false
