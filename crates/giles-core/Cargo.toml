[package]
name = "giles-core"
description = "Giles orchestration: agent loop, routing, sessions, scheduling, and plugin supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
giles-proto.workspace = true
giles-store.workspace = true
giles-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
futures.workspace = true
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tonic.workspace = true
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
