<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{#- htmx would otherwise inject an inline <style> for its request indicator, which the
    Content-Security-Policy blocks; giles.css carries those rules instead. #}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>{% block title %}Giles{% endblock %}</title>
<link rel="stylesheet" href="{{ crate::http::assets::stylesheet_path() }}">
<script src="{{ crate::http::assets::HTMX.path }}" defer></script>
<script src="{{ crate::http::assets::HTMX_SSE.path }}" defer></script>
{% block head %}{% endblock %}
</head>
<body>
<header><a href="/">Giles</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
