[package]
name = "giles-plugin-sdk"
description = "Serve a Giles channel implementation as an out-of-process gRPC plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["giles", "plugin", "grpc", "agent", "llm"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["tls"]
# `giles_plugin_sdk::tls`: rustls with the bundled Mozilla roots, for plugins' own connections.
tls = ["dep:rustls", "dep:webpki-root-certs"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
giles-proto.workspace = true
giles-types.workspace = true
libc.workspace = true
prost.workspace = true
prost-types.workspace = true
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11.0"
rustls = { version = "0.23.46", optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
webpki-root-certs = { workspace = true, optional = true }

[dev-dependencies]
hyper-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
tower.workspace = true

[lints]
workspace = true
