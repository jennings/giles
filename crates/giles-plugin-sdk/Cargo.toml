[package]
name = "giles-plugin-sdk"
description = "Serve a Giles channel implementation as an out-of-process gRPC plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["giles", "plugin", "grpc", "agent", "llm"]
categories = ["api-bindings", "network-programming"]

[dependencies]
giles-proto.workspace = true
giles-types.workspace = true
libc.workspace = true
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tonic.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
