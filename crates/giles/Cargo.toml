[package]
name = "giles"
description = "The Giles daemon binary and its command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["channel-web", "provider-anthropic", "provider-openai"]
# The built-in web channel.
channel-web = ["giles-core/channel-web"]
# The built-in Anthropic provider.
provider-anthropic = ["giles-core/provider-anthropic"]
# The built-in OpenAI-compatible provider.
provider-openai = ["giles-core/provider-openai"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
giles-core.workspace = true
# Timestamp conversions for the admin CLI commands.
giles-plugin-sdk = { workspace = true, default-features = false }
giles-proto.workspace = true
giles-types.workspace = true
jiff = { workspace = true, features = ["tz-system"] }
prost-types.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true

[dev-dependencies]
libc.workspace = true
# Usage rows for the `giles usage` end-to-end test.
giles-store.workspace = true
tempfile.workspace = true
