name: Docs

# Not path-filtered: `rumdl check .` lints every Markdown file in the repository, not only the book.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's runs share a group, so a newer push cancels the run in progress. Each push to
# main gets its own group (per commit), so every main commit gets a finished build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Documentation tool versions; keep in step with the versions used locally.
  RUMDL_VERSION: "0.3.0"
  MDBOOK_VERSION: "0.4.40"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install rumdl
        uses: rvben/rumdl@v0
        with:
          version: ${{ env.RUMDL_VERSION }}
          install-only: "true"
      - name: Lint Markdown
        run: rumdl check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The official prebuilt release binary.
      - name: Install mdBook
        run: |
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" mdbook
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build Docs
      # Only pushes to main publish; pull requests stop after the build.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: Docs/book

  deploy:
    name: Deploy
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, in push order; a deployment in progress is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
