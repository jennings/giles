name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's runs share a group, so a newer push cancels the run in progress. Each push to
# main gets its own group (per commit), so every main commit gets a finished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Protobuf tool version; keep in step with the version used locally.
  BUF_VERSION: "1.75.0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # With no argument, rustup installs the toolchain pinned in rust-toolchain.toml, with the
      # components and targets listed there.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Shows which Landlock ABI the Linux sandbox tests run against (`host check: ...`).
      - name: Sandbox host check
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p giles-core --locked host_probes_run -- --nocapture
        env:
          GILES_REQUIRE_LANDLOCK: "1"
      - name: Test
        run: cargo test --workspace --locked
        env:
          # GitHub's Ubuntu runners have Landlock, so the Linux sandbox tests must run there
          # rather than skip (they skip on kernels without it, like Apple's `container` VMs).
          GILES_REQUIRE_LANDLOCK: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  protobuf:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so `buf breaking` can read the base commit.
          fetch-depth: 0
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check formatting
        run: buf format --diff --exit-code
      # Pull requests compare against the base branch; pushes to main compare against the previous
      # tip of main, covering every commit in the push. A base without buf.yaml (before the first
      # contracts landed, or a new branch) has nothing to compare against.
      - name: Check for breaking changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=${BASE}"
          else
            echo "::notice::No buf module at base ${BASE}; skipping buf breaking."
          fi

  # Builds the container image from each push to main, smoke-tests it, and publishes it to the
  # GitHub Container Registry. Pull requests don't build it.
  image:
    name: Container image
    if: github.event_name == 'push'
    needs: [rust, protobuf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One publish at a time, in push order, so `latest` ends at the newest commit.
    concurrency:
      group: ${{ github.workflow }}-image
      cancel-in-progress: false
    env:
      TEST_TAG: giles:test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # ghcr.io/<owner>/<repo>, lowercased, tagged `latest` and `sha-<short commit>`. GitHub reports
      # the repository's license as Apache-2.0 alone, which would replace the Dockerfile's label.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      # amd64 only: an arm64 Rust release build under QEMU emulation is too slow.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The binaries run, and `giles serve` starts with the published layout: the default
      # entrypoint, the /data volume, the HTTP port, and the plugin sandbox (the runner's kernel has
      # Landlock, and Docker's default seccomp profile allows it).
      - name: Smoke test
        run: |
          docker run --rm "$TEST_TAG" --version
          docker run --rm --entrypoint sh "$TEST_TAG" -c \
            'ls -l /usr/local/bin/giles-channel-irc /usr/local/bin/giles-channel-email'
          # A new named volume takes /data's ownership (the giles user) from the image.
          docker run --rm --volume giles-smoke:/data --entrypoint sh "$TEST_TAG" -c \
            'printf "[core]\nhttp_listen = \"0.0.0.0:8080\"\n\n[owner]\nidentities = [\"web:owner\"]\n" > /data/giles.toml'
          docker run --detach --name giles-smoke --volume giles-smoke:/data \
            --publish 127.0.0.1:8080:8080 "$TEST_TAG"
          started=
          for _ in $(seq 30); do
            if docker exec giles-smoke giles status > status.txt 2>&1; then
              started=1
              break
            fi
            sleep 1
          done
          docker logs giles-smoke
          cat status.txt
          [ -n "$started" ]
          grep -q '^Plugin sandbox: Landlock ABI' status.txt
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          docker stop giles-smoke
          [ "$(docker inspect --format '{{.State.ExitCode}}' giles-smoke)" = 0 ]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build again, so every layer comes from the builder's cache.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
