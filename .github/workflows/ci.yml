name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's runs share a group, so a newer push cancels the run in progress. Each push to
# main gets its own group (per commit), so every main commit gets a finished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Protobuf tool version; keep in step with the version used locally.
  BUF_VERSION: "1.75.0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # With no argument, rustup installs the toolchain pinned in rust-toolchain.toml, with the
      # components and targets listed there.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Shows which Landlock ABI the Linux sandbox tests run against (`host check: ...`).
      - name: Sandbox host check
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p giles-core --locked host_probes_run -- --nocapture
        env:
          GILES_REQUIRE_LANDLOCK: "1"
      - name: Test
        run: cargo test --workspace --locked
        env:
          # GitHub's Ubuntu runners have Landlock, so the Linux sandbox tests must run there
          # rather than skip (they skip on kernels without it, like Apple's `container` VMs).
          GILES_REQUIRE_LANDLOCK: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  protobuf:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so `buf breaking` can read the base commit.
          fetch-depth: 0
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check formatting
        run: buf format --diff --exit-code
      # Pull requests compare against the base branch; pushes to main compare against the previous
      # tip of main, covering every commit in the push. A base without buf.yaml (before the first
      # contracts landed, or a new branch) has nothing to compare against.
      - name: Check for breaking changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=${BASE}"
          else
            echo "::notice::No buf module at base ${BASE}; skipping buf breaking."
          fi
