[package]
name = "giles-channel-echo"
description = "A test-only Giles channel plugin: scripted inbound events, recorded sends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
futures.workspace = true
# `tls` for the remote mode.
giles-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
# The core's plugin host, which these tests launch the plugin through, and a runtime around it
# (a configured agent needs a provider).
giles-core = { workspace = true, features = ["provider-anthropic"] }
giles-proto.workspace = true
hyper-util.workspace = true
libc.workspace = true
# Test certificates for the remote plugin over TLS.
rcgen.workspace = true
sha2.workspace = true
socket2 = "0.6.5"
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "process"] }
tokio-util.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tower.workspace = true

# Its own sandbox trampoline (see the file), so no libtest harness.
[[test]]
name = "host_sandbox"
harness = false

[lints]
workspace = true
