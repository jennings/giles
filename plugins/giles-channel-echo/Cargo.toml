[package]
name = "giles-channel-echo"
description = "A test-only Giles channel plugin: scripted inbound events, recorded sends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
futures.workspace = true
giles-plugin-sdk = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
giles-proto.workspace = true
hyper-util.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "process"] }
tonic.workspace = true
tonic-health.workspace = true
tower.workspace = true

[lints]
workspace = true
