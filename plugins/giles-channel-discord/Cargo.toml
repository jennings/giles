[package]
name = "giles-channel-discord"
description = "The Giles Discord channel plugin: a bot account that receives and sends direct messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
futures.workspace = true
giles-plugin-sdk.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# The Gateway client. Default features off: no `twilight-http` (the Gateway needs no REST call),
# no `zstd` (a C build for compression DM traffic doesn't need), and the Mozilla roots compiled in
# (`webpki-roots`) instead of the platform verifier, like every other TLS client in Giles.
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots"] }

[dev-dependencies]
giles-proto.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
tonic.workspace = true
# A Gateway server for `tests/gateway.rs`.
tokio-websockets = { version = "0.13.3", features = ["server"] }

[lints]
workspace = true
