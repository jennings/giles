[package]
name = "giles-channel-discord"
description = "The Giles Discord channel plugin: a bot account that receives and sends direct messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
futures.workspace = true
giles-plugin-sdk.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
giles-proto.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "test-util"] }
tonic.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
