[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# Spikes (e.g. spikes/whatsapp) are standalone crates with their own lockfiles, kept
# out of the workspace build and CI. `exclude` takes path prefixes, not globs.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Stephen Jennings <stephen.g.jennings@gmail.com>"]
repository = "https://github.com/jennings/doozers"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates.
doozers-core = { path = "crates/doozers-core", version = "0.1.0", default-features = false }
doozers-plugin-sdk = { path = "crates/doozers-plugin-sdk", version = "0.1.0" }
doozers-proto = { path = "crates/doozers-proto", version = "0.1.0" }
doozers-store = { path = "crates/doozers-store", version = "0.1.0" }
doozers-types = { path = "crates/doozers-types", version = "0.1.0" }

# Shared third-party stack (PLAN section 13.2). Members opt in with `<dep>.workspace = true` and
# add the features they need.
anyhow = "1.0.104"
async-trait = "0.1.92"
# AES-256-GCM for the core's secret store and X25519 for the SDK's host key scan.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22.1"
bytes = "1.12.1"
futures = "0.3.34"
# Default features off: each crate opts into the time zone database support it needs.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2.191"
prost = "0.14.4"
prost-types = "0.14.4"
# Outbound HTTP client (`doozers_core::net`). TLS is rustls; `net::tls_client_builder` trusts only
# the bundled `webpki-root-certs`, so the platform verifier this feature compiles in is never used.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
# SQLite (`doozers-store`; `doozers-core` tests inject faults through a second connection).
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# SSH keys: the core generates, stores, and signs with them; the SDK parses host keys and verifies
# their signatures. No DSA, no `sk-` keys. Members add `encryption` and `getrandom` as needed.
ssh-key = { version = "0.6.7", default-features = false, features = ["ecdsa", "ed25519", "p256", "p384", "p521", "rsa", "std"] }
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.1.8"
tonic = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The Mozilla root certificates every Doozers TLS client trusts instead of the OS store.
webpki-root-certs = "1.0.10"
# TLS for remote plugins (`doozers_plugin_sdk::RemoteServer`, the core's plugin host); rustls itself
# comes from `doozers_plugin_sdk::tls`.
tokio-rustls = { version = "0.26.6", default-features = false }
# Test certificates for remote plugins over TLS.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }

# `hyper-util` and `tower` make the one-shot connector that reaches a plugin over a socket pair (the
# plugin host and tests).
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic picks: cheap, low false-positive, and they catch needless clones/copies.
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
# Restriction picks: every `unsafe` block needs a `// SAFETY:` comment, and no stubs or debug
# output get committed.
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

# RSA key generation (`doozers_core::ssh`) takes minutes unoptimized, which the SSH key tests would
# pay for every RSA key they generate.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Password hashing (`doozers_core::channels::web`) takes seconds unoptimized, which every web sign-in
# test would pay for each password it hashes or checks.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
