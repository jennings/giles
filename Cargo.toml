[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# Spikes (e.g. spikes/whatsapp, TASKS.md 1.13) are standalone crates with their own lockfiles, kept
# out of the workspace build and CI. `exclude` takes path prefixes, not globs.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Stephen Jennings <stephen.g.jennings@gmail.com>"]
repository = "https://github.com/jennings/giles"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates.
giles-core = { path = "crates/giles-core", version = "0.1.0", default-features = false }
giles-plugin-sdk = { path = "crates/giles-plugin-sdk", version = "0.1.0" }
giles-proto = { path = "crates/giles-proto", version = "0.1.0" }
giles-store = { path = "crates/giles-store", version = "0.1.0" }
giles-types = { path = "crates/giles-types", version = "0.1.0" }

# Shared third-party stack (PLAN section 13.2). Members opt in with `<dep>.workspace = true` and
# add the features they need.
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22.1"
bytes = "1.12.1"
futures = "0.3.34"
# Default features off: each crate opts into the time zone database support it needs.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2.191"
prost = "0.14.4"
prost-types = "0.14.4"
# Outbound HTTP client (`giles_core::net`). TLS is rustls; `net::tls_client_builder` trusts only the
# bundled `webpki-root-certs`, so the platform verifier this feature compiles in is never used.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
# SQLite (`giles-store`; `giles-core` tests inject faults through a second connection).
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.1.8"
tonic = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The Mozilla root certificates every Giles TLS client trusts instead of the OS store.
webpki-root-certs = "1.0.10"

# `hyper-util` and `tower` make the one-shot connector that reaches a plugin over a socket pair (the
# plugin host and tests).
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic picks: cheap, low false-positive, and they catch needless clones/copies.
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
# Restriction picks: every `unsafe` block needs a `// SAFETY:` comment, and no stubs or debug
# output get committed.
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
